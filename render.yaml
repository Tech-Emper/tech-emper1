services:
  # Backend Web Service
  - type: web
    name: insurance-wizard-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-wizard-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: insurance-wizard-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_API_KEY
        sync: false
      - key: RECOMMENDATION_MODE
        value: AI
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CRON_SECRET
        generateValue: true
  # Frontend Web Service
  - type: web
    name: insurance-wizard-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: insurance-wizard-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Daily callback-digest cron — 09:00 IST (= 03:30 UTC)
  - type: cron
    name: insurance-wizard-callback-digest
    runtime: python
    schedule: "30 3 * * *"
    buildCommand: "echo no build needed"
    startCommand: >-
      curl -fsS -X POST "$BACKEND_URL/api/cron/callback-digest" -H "X-Cron-Secret: $CRON_SECRET"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: insurance-wizard-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CRON_SECRET
        fromService:
          type: web
          name: insurance-wizard-backend
          envVarKey: CRON_SECRET

databases:
  - name: insurance-wizard-db
    plan: free
