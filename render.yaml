services:
  # Backend Web Service
  - type: web
    name: insurance-wizard-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-wizard-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: insurance-wizard-frontend
          property: url
      - key: GEMINI_API_KEY
        sync: false
      - key: RECOMMENDATION_MODE
        value: AI
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        value: onboarding@resend.dev

  # Frontend Static Site
  - type: static
    name: insurance-wizard-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: insurance-wizard-backend
          property: url

databases:
  - name: insurance-wizard-db
    plan: free
